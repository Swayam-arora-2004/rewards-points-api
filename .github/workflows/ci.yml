name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOCKER_API_VERSION: "1.44"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and verify
        run: mvn verify --batch-mode --no-transfer-progress -Dapi.version=1.44
        env:
          DOCKER_API_VERSION: "1.44"

