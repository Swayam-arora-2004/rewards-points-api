spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rewardsdb}
    username: ${SPRING_DATASOURCE_USERNAME:rewards_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_before_use}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080

