# Testcontainers configuration
# Points to Docker Desktop raw socket on macOS – the .docker/run/docker.sock
# symlink fails JNA's BsdDomainSocket; docker.raw.sock works (Decision D-004).
# Ryuk disabled: its container gets 404 on inspect via the shaded docker-java
# client on Docker Desktop macOS; containers clean up at JVM exit (Decision D-005).
# See: https://java.testcontainers.org/features/configuration/
docker.host=unix:///Users/sa/Library/Containers/com.docker.docker/Data/docker.raw.sock
ryuk.disabled=true
